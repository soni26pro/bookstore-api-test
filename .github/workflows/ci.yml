name: CI Pipeline

on:
  push:
    branches:
      - main # or your default branch name

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11' # Match the project's target Java version
        distribution: 'temurin' # Or 'adopt', 'zulu', etc.
        cache: 'maven'

    - name: Build and run tests
      run: mvn clean test -B # -B for batch mode, less verbose output

    # Optional: Add a step to publish Allure Report if needed
    # Requires configuring Allure server or using a GitHub Pages setup
    # - name: Publish Allure Report
    #   uses: simple-actions/allure-report-action@v2
    #   with:
    #     allure_results_folder: allure-results
    #     github_token: ${{ secrets.GITHUB_TOKEN }}
    #     github_pages: true # Set to true if publishing to GitHub Pages
